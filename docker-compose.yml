# ============================================================
# Expense Tracker — Docker Compose
# Uses your EXISTING MySQL container on localhost:3306
# App runs on http://localhost:8080
# ============================================================

services:

  # ── PHP + Apache app ─────────────────────────────────────
  app:
    build: .
    container_name: expense_tracker_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: host.docker.internal   # reaches your existing MySQL on localhost:3306
      DB_PORT: "3306"
      DB_NAME: expense_tracker
      DB_USER: root
      DB_PASS: root
    extra_hosts:
      - "host.docker.internal:host-gateway"  # required on Linux; no-op on Docker Desktop